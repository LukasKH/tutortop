version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    # STYLEGUIDE.md, "Errors".
    - errcheck
    # STYLEGUIDE.md, "Control flow".
    - exhaustive
    - gocognit
    - nestif
    - revive
    # STYLEGUIDE.md, "Embedding in structs".
    - embeddedstructfieldcheck
    # STYLEGUIDE.md, "Boundaries".
    - depguard
    # STYLEGUIDE.md, "Function Grouping and Ordering".
    - funcorder

  # gocognit (min-complexity 30) and nestif (min-complexity 5) keep their
  # defaults.
  settings:
    exhaustive:
      # A default: doesn't count as covering the missing cases. It would also
      # swallow any constant added later, so the switches that must decide
      # about it would go unflagged. List every case; a default: may still
      # handle values outside the constants.
      default-signifies-exhaustive: false
    embeddedstructfieldcheck:
      forbid-mutex: true
    depguard:
      rules:
        agents-through-their-cli:
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: run agents through their CLI (internal/agent), not a model API
            - pkg: github.com/openai/openai-go
              desc: run agents through their CLI (internal/agent), not a model API
            - pkg: github.com/sashabaranov/go-openai
              desc: run agents through their CLI (internal/agent), not a model API
            - pkg: google.golang.org/genai
              desc: run agents through their CLI (internal/agent), not a model API
        http-only-in-mcp:
          # internal/copilot downloads GitHub's Copilot language server.
          files: ["$all", "!$test", "!**/internal/mcp/**", "!**/internal/copilot/**"]
          deny:
            - pkg: net/http
              desc: the frontend talks to Go through Wails services and agents through MCP (internal/mcp)
        processes-only-where-they-belong:
          # Agent CLIs, the sandbox engine, the login shell, CLI detection, git
          # and Copilot's language server, which must reach GitHub and so
          # can't run in the sandbox.
          files:
            - "$all"
            - "!$test"
            - "!**/internal/agent/**"
            - "!**/internal/copilot/**"
            - "!**/internal/sandbox/**"
            - "!**/internal/shellpath/**"
            - "!**/internal/settings/**"
            - "!**/internal/workspace/**"
          deny:
            - pkg: os/exec
              desc: run learner and tutor code in the sandbox (internal/sandbox)
        wails-only-in-main:
          # Wails links GTK and WebKitGTK on Linux under CGO; keeping it in
          # main.go lets internal packages lint and test with -race without them.
          files: ["**/internal/**"]
          deny:
            - pkg: github.com/wailsapp/wails/v3
              desc: keep Wails in main.go so internal packages test and lint without GTK
    revive:
      # Only the rules that turn an if/else ending in return into a guard
      # clause. revive's default rule set is broader than the style guide.
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else

formatters:
  enable:
    - goimports
