version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    # STYLEGUIDE.md, "Errors".
    - errcheck
    # STYLEGUIDE.md, "Control flow".
    - exhaustive
    - gocognit
    - nestif
    - revive
    # STYLEGUIDE.md, "Embedding in structs".
    - embeddedstructfieldcheck

  # gocognit (min-complexity 30) and nestif (min-complexity 5) keep their
  # defaults.
  settings:
    exhaustive:
      # A default: doesn't count as covering the missing cases. It would also
      # swallow any constant added later, so the switches that must decide
      # about it would go unflagged. List every case; a default: may still
      # handle values outside the constants.
      default-signifies-exhaustive: false
    embeddedstructfieldcheck:
      forbid-mutex: true
    revive:
      # Only the rules that turn an if/else ending in return into a guard
      # clause. revive's default rule set is broader than the style guide.
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else

formatters:
  enable:
    - goimports
