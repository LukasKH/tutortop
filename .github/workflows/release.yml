# Builds the installers and attaches them to a *draft* GitHub release.
#
# release-please.yml calls it once a release PR is merged, with the tag and
# draft release it made. A tag pushed by hand runs it too, and makes the draft:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Nothing is published until you open the draft on GitHub and press Publish.
# Run it by hand (Actions > Release > Run workflow) to get the installers as
# workflow artifacts without making a release; that build uses the version in
# build/config.yml.
#
# Linux needs CGO against GTK/WebKitGTK and macOS against Apple's frameworks,
# so each is built on its own OS. Windows doesn't use CGO and is cross-compiled
# on the Linux runner.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: "The tag to build and attach the installers to, such as v0.2.6"
        required: true
        type: string
    secrets:
      UPDATER_SIGNING_KEY:
        description: "Ed25519 private key used by wails3 updater manifest to sign update payloads"
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-windows:
    # The oldest Ubuntu with WebKitGTK 6.0. The binary needs a glibc at least
    # this new, so building on newer Ubuntu would drop support for 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }} # "" outside workflow_call: the commit that started the run
          persist-credentials: false
      # Before setup-build: installing the Wails CLI compiles against GTK.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev nsis file zip
      - uses: ./.github/actions/setup-build

      - name: Linux packages
        run: |
          wails3 task linux:build
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm
          wails3 task linux:generate:aur
      - name: AppImage
        # Bundles WebKitGTK, so it's the most fragile format; don't block the release on it.
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: wails3 task linux:create:appimage
      - name: Windows installer
        # Per-user scope installs to %LOCALAPPDATA%\Programs\Tutortop so in-app updates need no UAC.
        run: wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user

      # The names carry no version, so .../releases/latest/download/<name>
      # always fetches the newest release. install.sh and install.ps1 rely on it.
      - name: Name files
        run: |
          mkdir dist
          mv bin/tutortop.deb dist/tutortop_amd64.deb
          mv bin/tutortop.rpm dist/tutortop-x86_64.rpm
          mv bin/tutortop.pkg.tar.zst dist/tutortop-x86_64.pkg.tar.zst
          tar -czf dist/tutortop-linux-amd64.tar.gz -C bin tutortop
          mv bin/tutortop-amd64-installer.exe dist/tutortop-windows-x64-setup.exe
          zip -j dist/tutortop-windows-amd64.zip bin/tutortop.exe
          for f in bin/*.AppImage; do [ -e "$f" ] && mv "$f" dist/tutortop-x86_64.AppImage; done
          ls -la dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: linux-windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }} # "" outside workflow_call: the commit that started the run
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Universal .dmg and update archive (unsigned)
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
          mkdir dist
          mv bin/*.dmg dist/tutortop-macos-universal.dmg
          # Plain zip with one top-level tutortop.app entry (no __MACOSX) for Wails' updater.
          (cd bin && zip -ry ../dist/tutortop-darwin-universal.zip tutortop.app)
          ls -la dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    # Not on a manual run, even on a tag: that must never touch a published release.
    if: inputs.tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [linux-windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install the Wails CLI
        run: CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate and verify update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RELEASE_PLEASE: ${{ inputs.tag }}
          TAG: ${{ inputs.tag || github.ref_name }}
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATER_SIGNING_KEY" ]; then
            echo "UPDATER_SIGNING_KEY secret is not set." >&2
            exit 1
          fi
          built_version="$(sed -n 's/^[[:space:]]*Version = "\(.*\)".*/\1/p' internal/update/update.go)"
          if [ "$built_version" != "${TAG#v}" ]; then
            echo "internal/update/update.go Version ($built_version) does not match tag $TAG." >&2
            exit 1
          fi
          key_file="$(mktemp)"
          notes_file="$(mktemp)"
          trap 'rm -f "$key_file" "$notes_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$UPDATER_SIGNING_KEY" > "$key_file"

          notes_args=()
          if [ -n "$FROM_RELEASE_PLEASE" ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes_file" || true
            if [ -s "$notes_file" ]; then
              notes_args=(-notes-file "$notes_file")
            fi
          fi

          payloads=(
            dist/tutortop-darwin-universal.zip
            dist/tutortop-windows-amd64.zip
            dist/tutortop-linux-amd64.tar.gz
          )

          wails3 updater manifest \
            -version "${TAG#v}" \
            -name "Tutortop ${TAG#v}" \
            -key "$key_file" \
            -url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            -output dist/manifest.json \
            "${notes_args[@]}" \
            "${payloads[@]}"
          wails3 updater verify -manifest dist/manifest.json -publickey build/updater.pub -dir dist
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RELEASE_PLEASE: ${{ inputs.tag }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          if [ -n "$FROM_RELEASE_PLEASE" ]; then
            # release-please made the draft, with the changelog as its notes.
            # Stop rather than replace the files of a release that's public.
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "$TAG isn't a draft release; not replacing its files." >&2
              exit 1
            fi
            # A re-run starts from an empty draft, so SHA256SUMS lists every
            # file on it: an AppImage left from an earlier run may not be rebuilt.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r name; do
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
              done
            gh release upload "$TAG" * --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Tutortop ${TAG#v}"
          else
            # A tag pushed by hand has no release yet.
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Tutortop ${TAG#v}"
          fi
