# Builds the installers and attaches them to a *draft* GitHub release.
#
# release-please.yml calls it once a release PR is merged, with the tag and
# draft release it made. A tag pushed by hand runs it too, and makes the draft:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Nothing is published until you open the draft on GitHub and press Publish.
# Run it by hand (Actions > Release > Run workflow) to get the installers as
# workflow artifacts without making a release; that build uses the version in
# build/config.yml.
#
# Linux needs CGO against GTK/WebKitGTK and macOS against Apple's frameworks,
# so each is built on its own OS. Windows doesn't use CGO and is cross-compiled
# on the Linux runner.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: "The tag to build and attach the installers to, such as v0.2.6"
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-windows:
    # The oldest Ubuntu with WebKitGTK 6.0. The binary needs a glibc at least
    # this new, so building on newer Ubuntu would drop support for 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }} # "" outside workflow_call: the commit that started the run
          persist-credentials: false
      # Before setup-build: installing the Wails CLI compiles against GTK.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev nsis file
      - uses: ./.github/actions/setup-build

      - name: Linux packages
        run: |
          wails3 task linux:build
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm
          wails3 task linux:generate:aur
      - name: AppImage
        # Bundles WebKitGTK, so it's the most fragile format; don't block the release on it.
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: wails3 task linux:create:appimage
      - name: Windows installer
        run: wails3 task windows:package ARCH=amd64

      # The names carry no version, so .../releases/latest/download/<name>
      # always fetches the newest release. install.sh and install.ps1 rely on it.
      - name: Name files
        run: |
          mkdir dist
          mv bin/tutortop.deb dist/tutortop_amd64.deb
          mv bin/tutortop.rpm dist/tutortop-x86_64.rpm
          mv bin/tutortop.pkg.tar.zst dist/tutortop-x86_64.pkg.tar.zst
          mv bin/tutortop-amd64-installer.exe dist/tutortop-windows-x64-setup.exe
          for f in bin/*.AppImage; do [ -e "$f" ] && mv "$f" dist/tutortop-x86_64.AppImage; done
          ls -la dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: linux-windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }} # "" outside workflow_call: the commit that started the run
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Universal .dmg (unsigned)
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
          mkdir dist
          mv bin/*.dmg dist/tutortop-macos-universal.dmg
          ls -la dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: [linux-windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          # release-please has made the draft, with the changelog as its notes;
          # a tag pushed by hand has none yet.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" * --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Tutortop ${TAG#v}"
          else
            gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Tutortop ${TAG#v}"
          fi
