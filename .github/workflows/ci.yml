name: CI

# Pull requests, and main once merged. A push to a PR's branch runs once, as
# the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; main runs them all.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pre-commit hooks, so a commit made with --no-verify can't skip them.
  # The Go tests run in the test job instead, beside the benchmarks.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the commit messages to check
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The wails-bindings hook runs the wails3 on PATH, at the Wails version
      # in go.mod. CGO_ENABLED=0 so the CLI builds without GTK.
      - name: Install the Wails CLI
        run: CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      # The hook runs the golangci-lint on PATH.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - run: npm ci
        working-directory: frontend
      # Keep in step with mise.toml.
      - run: pipx install pre-commit==4.7.0
      - name: Pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: go-test
          # wails-bindings loads main.go with -tags server; without CGO that
          # needs no GTK or WebKitGTK.
          CGO_ENABLED: "0"
      - name: Commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        # The hook runs `commitlint --edit`, which reads .git/COMMIT_EDITMSG
        # whatever file it's given.
        run: |
          for sha in $(git rev-list --no-merges "$FROM..$TO"); do
            git log -1 --format=%B "$sha" > .git/COMMIT_EDITMSG
            pre-commit run commitlint --hook-stage commit-msg --commit-msg-filename .git/COMMIT_EDITMSG
          done

  # GitHub's Ubuntu runners have Docker, so the sandbox tests run here too.
  # Tests that talk to the real Claude Code, Codex and Antigravity CLIs need -tags live.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -short -count=1 ./internal/...
      # Runs each benchmark once, so they keep working. Shared runners are too
      # noisy to compare timings; `task bench:compare` does that locally.
      - name: Benchmarks still run
        run: go test -run '^$' -bench . -benchtime 1x ./internal/app/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The bindings, typecheck, lint, format and tests are checked in the
      # pre-commit job.
      - run: npm ci
      - run: npm run build
