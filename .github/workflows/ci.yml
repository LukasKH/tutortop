name: CI

# Pull requests only. Enable "Require branches to be up to date before merging"
# in the main branch ruleset so every merged commit was already checked here.
on:
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # GitHub's Ubuntu runners have Docker, so the sandbox tests run here too.
  # Tests that talk to the real Claude Code, Codex and Antigravity CLIs need -tags live.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        name: Check for Go changes
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=false
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$FROM...$TO" | grep -Eq '^(internal/|[^/]+\.go$|build/updater\.pub$|go\.mod$|go\.sum$|\.golangci\.yml$|\.github/workflows/ci\.yml$|frontend/bindings/)'; then
            changed=true
          else
            echo "No Go files changed; skipping Go checks."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.changes.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: steps.changes.outputs.changed == 'true'
        with:
          version: v2.15.0
          args: ./internal/...
      # STYLEGUIDE.md, "Struct literals": &T{...}, not new(T).
      - name: Build structs with &T{} not new(T)
        if: steps.changes.outputs.changed == 'true'
        run: |
          if rg -nP '(?<![\w.])new\((?!(?:any|bool|byte|complex64|complex128|error|float32|float64|int|int8|int16|int32|int64|rune|string|uint|uint8|uint16|uint32|uint64|uintptr|[A-Z])\))[\w.]+\)' --glob '*.go'; then
            echo "Build structs with &T{} not new(T) (STYLEGUIDE.md)." >&2
            exit 1
          fi
      # CGO_ENABLED=0 so the CLI builds and loads main.go with -tags server without GTK or WebKitGTK.
      - name: Install the Wails CLI
        if: steps.changes.outputs.changed == 'true'
        run: CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: Wails bindings up to date
        if: steps.changes.outputs.changed == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          wails3 generate bindings -f '-tags server' -clean=true -ts -i
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git diff -- frontend/bindings
            git status --short -- frontend/bindings
            echo "frontend/bindings is out of date; run 'wails3 generate bindings -clean=true -ts -i' and commit the result." >&2
            exit 1
          fi
      - name: Go tests
        if: steps.changes.outputs.changed == 'true'
        run: go test -race -short -count=1 ./internal/...
      # Runs each benchmark once, so they keep working. Shared runners are too
      # noisy to compare timings; `wails3 task bench:compare` does that locally.
      - name: Benchmarks still run
        if: steps.changes.outputs.changed == 'true'
        run: go test -run '^$' -bench . -benchtime 1x ./internal/app/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        name: Check for frontend changes
        working-directory: .
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=false
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --name-only "$FROM...$TO" | grep -Eq '^(frontend/|\.github/workflows/ci\.yml$)'; then
            changed=true
          else
            echo "No frontend files changed; skipping frontend checks."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: npm exec -- tsc --noEmit -p .
      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint
      - name: Format check
        if: steps.changes.outputs.changed == 'true'
        run: npm run format:check
      - name: Tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test
      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build
