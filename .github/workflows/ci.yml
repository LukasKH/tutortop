name: CI

# Pull requests, and main once merged. A push to a PR's branch runs once, as
# the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; main runs them all.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # internal/app imports Wails, which links GTK and WebKitGTK on Linux.
      - name: Install GTK and WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ./internal/...

  # GitHub's Ubuntu runners have Docker, so the sandbox tests run here too.
  # Tests that talk to the real Claude Code and Codex CLIs need -tags live.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # internal/app imports Wails, which links GTK and WebKitGTK on Linux.
      - name: Install GTK and WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race -short -count=1 ./internal/...
      # Runs each benchmark once, so they keep working. Shared runners are too
      # noisy to compare timings; `task bench:compare` does that locally.
      - name: Benchmarks still run
        run: go test -run '^$' -bench . -benchtime 1x ./internal/app/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # internal/app imports Wails, which links GTK and WebKitGTK on Linux.
      - name: Install GTK and WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The bindings are the contract between the Go app and the frontend.
      # Regenerate them so tsc checks the frontend against the current Go
      # code, not a stale copy. CGO_ENABLED=0 so the Wails CLI builds without GTK.
      - name: Check the bindings are up to date
        working-directory: .
        run: |
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          wails3 generate bindings -clean=true -ts -i
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git status --short -- frontend/bindings
            git diff -- frontend/bindings
            echo "::error::frontend/bindings is out of date. Run 'wails3 generate bindings -clean=true -ts -i' and commit the result."
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
