default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # go vet's analyzers, Staticcheck, errcheck, exhaustive, gocognit, nestif,
      # revive, embeddedstructfieldcheck and gofmt/goimports, configured in
      # .golangci.yml.
      - id: golangci-lint
        name: Go vet and lint
        entry: golangci-lint run ./internal/...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # STYLEGUIDE.md, "Struct literals": &T{...}, not new(T). A regex can't
      # see types, so this flags new() of any named type, and lets through
      # built-in types and single-letter type parameters such as *new(T).
      - id: no-new-struct
        name: Build structs with &T{} not new(T)
        entry: '(?<![\w.])new\((?!(?:any|bool|byte|complex64|complex128|error|float32|float64|int|int8|int16|int32|int64|rune|string|uint|uint8|uint16|uint32|uint64|uintptr|[A-Z])\))[\w.]+\)'
        language: pygrep
        types: [go]
        stages: [pre-commit]

      # The sandbox tests need Docker or Podman, and fail without one.
      # Tests that talk to the real Claude Code and Codex CLIs need -tags live
      # and run by hand.
      - id: go-test
        name: Go tests (race detector)
        entry: go test -race -short -count=1 ./internal/...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # The bindings are the contract between the Go app and the frontend.
      # Regenerate them from the staged Go code; if that changes them, the
      # commit fails and the new bindings are left to stage. mise.toml pins
      # wails3 to the Wails version in go.mod. -tags server avoids GTK/WebKitGTK
      # when paired with CGO_ENABLED=0 in CI.
      - id: wails-bindings
        name: Wails bindings up to date
        entry: wails3 generate bindings -f '-tags server' -clean=true -ts -i
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-typecheck
        name: Frontend typecheck
        entry: npm --prefix frontend exec -- tsc --noEmit -p frontend
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-commit]

      # Oxlint with React's hooks rules (frontend/.oxlintrc.json), as in Vite's React template.
      - id: frontend-lint
        name: Frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-commit]

      # Prettier, with the Tailwind plugin sorting class names (frontend/.prettierrc.json).
      - id: frontend-format
        name: Frontend formatting
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-commit]

      # Vitest: the frontend's state logic and hooks, without the Go app.
      - id: frontend-test
        name: Frontend tests
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-commit]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        language_version: system
        additional_dependencies: ['@commitlint/config-conventional@21.2.3']
